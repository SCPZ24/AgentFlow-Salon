<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E2E · 人机职责的演进</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#25332F;background:#E8E7E1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;overflow:hidden}
#stage{width:min(100vw,calc(100dvh * 16 / 9));aspect-ratio:16/9;background:#F7F6F0;touch-action:none;user-select:none}
#stage>svg{display:block;width:100%;height:100%}#stage:focus{outline:none}
dialog{width:min(820px,92vw);max-height:90dvh;overflow:auto;padding:30px;border:1px solid #D8DDD5;border-radius:18px;background:#F7F6F0;color:#25332F;box-shadow:0 20px 80px #25332F26}dialog::backdrop{background:#25332F44}dialog header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}dialog h2{font-size:26px;margin:0}button{font:inherit;font-size:19px;padding:10px 16px;border:1px solid #CCD3C9;border-radius:9px;background:#FFF;color:inherit;cursor:pointer}button:hover{border-color:#397664}button:focus-visible,input:focus-visible{outline:3px solid #397664;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.primary,button[aria-current]{background:#397664;color:white;border-color:#397664}.transport-controls,#phase-nav,.settings{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}#phase-nav{padding:20px 0;border-block:1px solid #D8DDD5}.settings{align-items:center;justify-content:space-between}.settings label{display:flex;align-items:center;gap:8px}input{width:20px;height:20px;accent-color:#397664}.hint{font-size:16px;line-height:1.8;color:#65716A}a{color:#397664}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@media print{body{background:white}#stage{width:100%;height:auto}dialog{display:none}}
</style>
</head>
<body>
<main id="stage" tabindex="-1" aria-label="E2E 六时代职责演示" aria-busy="false"></main>
<p id="live-status" class="sr-only" aria-live="polite"></p>
<dialog id="controls" aria-labelledby="control-title">
<header><h2 id="control-title">演示控制</h2><button id="close-controls">关闭 Esc</button></header>
<div class="transport-controls"><button id="prev">← 上一步</button><button id="next" class="primary">下一步 →</button><button id="replay">重播 P</button><button id="reset">重置 R</button></div>
<nav id="phase-nav" aria-label="阶段跳转"></nav>
<div class="settings"><label><input type="checkbox" id="motion">减少动效</label><button id="fullscreen">全屏</button></div>
<p id="fullscreen-note" class="hint" role="status"></p>
<p class="hint">← / → 或 Space 切换时代 · 每次转场约 1.2 秒，随后暂停。<br>动画中再次前进，只完成当前转场。P 重播 · R 重置 · C 打开控制。</p>
<p class="hint"><a href="speaker-notes.md">讲者备注</a> · <a href="stills/">静态备份</a></p>
</dialog>
<noscript>请启用 JavaScript，或打开 stills 文件夹中的静态备份。</noscript>
<script id="scene-model">
'use strict';
// Capability stages for teaching, not a chronology of specific products.
const CHAIN=[
  ['goal','提出目标'],['read','读取现有代码'],['search','搜索获取信息'],
  ['architecture','设计实现架构'],['design','设计代码'],['write-tests','编写测试'],
  ['implement','实现代码'],['unit-tests','运行单元测试'],['browser','浏览器验证'],['accept','验收目标']
];
const LABELS={...Object.fromEntries(CHAIN),paste:'粘贴代码给 AI',copy:'复制 AI 代码',adjust:'微调并写入项目',implement:'编辑项目代码'};
const ERAS=[
  {title:'ChatBox',caption:'AI 提供代码方案',ai:['design'],flow:['goal','read','search','architecture','paste','design','write-tests','copy','adjust','unit-tests','browser','accept']},
  {title:'模型能力提升',caption:'AI 开始承担架构设计',ai:['architecture','design'],flow:['goal','read','search','paste','architecture','design','write-tests','copy','adjust','unit-tests','browser','accept']},
  {title:'接入搜索',caption:'AI 自主获取外部资料',ai:['search','architecture','design'],flow:['goal','read','paste','search','architecture','design','write-tests','copy','adjust','unit-tests','browser','accept']},
  {title:'Coding Agent',caption:'AI 直接读取并修改项目',ai:['read','search','architecture','design','write-tests','implement'],flow:CHAIN.map(([id])=>id)},
  {title:'Skills / Workflow',caption:'AI 按工作流自主运行测试',ai:['read','search','architecture','design','write-tests','implement','unit-tests'],flow:CHAIN.map(([id])=>id)},
  {title:'Computer Use',caption:'AI 操控浏览器完成验证',ai:['read','search','architecture','design','write-tests','implement','unit-tests','browser'],flow:CHAIN.map(([id])=>id)}
];
const PHASES=ERAS.map((era,i)=>[era.title,i]);
function defaults(){return {step:0,motion:'full'};}
function parseState(hash){
  const state=defaults(),params=new URLSearchParams(hash.replace(/^#/,''));
  const legacy={branch:'main',decision:'none',human:'none',sub:'0'};
  for(const [key,value] of params){
    if(params.getAll(key).length!==1)return defaults();
    if(key==='step'){
      if(!/^\d+$/.test(value)||Number(value)>=ERAS.length)return defaults();
      state.step=Number(value);
    }else if(key==='motion'){
      if(!['full','reduced'].includes(value))return defaults();
      state.motion=value;
    }else if(!Object.hasOwn(legacy,key)||legacy[key]!==value)return defaults();
  }
  return state;
}
function serializeState(state){return '#'+new URLSearchParams({step:state.step,motion:state.motion}).toString();}
function nextState(state){return state.step<ERAS.length-1?{...state,step:state.step+1}:null;}
function prevState(state){return state.step>0?{...state,step:state.step-1}:null;}
function sceneFor(state){
  const era=ERAS[state.step];
  return {state,title:era.title,caption:era.caption,
    owners:CHAIN.map(([id])=>era.ai.includes(id)?'ai':'human'),
    cards:era.flow.map(id=>({id,label:LABELS[id],owner:era.ai.includes(id)?'ai':'human'}))};
}
</script>
<script id="scene-art">
// Shared by the live SVG and the offline PNG exporter.
const C={bg:'#F7F6F0',paper:'#FDFDF9',ink:'#25332F',muted:'#748078',line:'#DCE1D9',human:'#80649D',humanSoft:'#F0EBF5',ai:'#347C70',aiSoft:'#E8F2ED',route:'#BBC4BB',flow:'#78867D'};
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const rect=(x,y,w,h,fill,stroke='none',r=10,extra='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" ${extra}/>`;
const text=(x,y,value,size=28,color=C.ink,weight=400,anchor='start',extra='')=>`<text x="${x}" y="${y}" font-size="${size}" fill="${color}" font-weight="${weight}" text-anchor="${anchor}" ${extra}>${esc(value)}</text>`;
const CARD={w:736,h:44,startY:366,endY:886,humanX:104,aiX:1080};
function layoutCards(cards){
  const totals={human:0,ai:0},counts={human:0,ai:0};
  cards.forEach(card=>totals[card.owner]++);
  return cards.map(card=>{
    const count=totals[card.owner],index=counts[card.owner]++;
    const fraction=count===1?.5:index/(count-1);
    return {...card,x:CARD[card.owner+'X'],y:CARD.startY+fraction*(CARD.endY-CARD.startY)};
  });
}
function cardSVG(card,emphasis=false){
  return `<g id="card-${card.id}" data-owner="${card.owner}" transform="translate(${card.x} ${card.y})" aria-label="${esc(card.label)}：${card.owner==='ai'?'AI':'人类'}">`
    +rect(0,0,CARD.w,CARD.h,C[card.owner+'Soft'],emphasis?C[card.owner]:C.line,8,`id="card-bg-${card.id}" stroke-width="${emphasis?2.5:1}"`)
    +rect(0,10,3,24,C[card.owner],'none',1)
    +text(22,31,card.label,28,C.ink,450)+'</g>';
}
function connections(cards){
  return cards.slice(1).map((to,i)=>{
    const from=cards[i],cross=from.owner!==to.owner;
    let points;
    if(!cross){
      const x=from.x+CARD.w/2;
      points=[[x,from.y+CARD.h],[x,to.y-1]];
    }else{
      const toAI=to.owner==='ai',x1=toAI?from.x+CARD.w:from.x,x2=toAI?to.x:to.x+CARD.w;
      const gutter=toAI?932:988;
      const sourceY=from.y+CARD.h/2+(cards[i-1]?.owner!==undefined&&cards[i-1].owner!==from.owner?10:0);
      const targetY=to.y+CARD.h/2-(cards[i+2]?.owner!==undefined&&cards[i+2].owner!==to.owner?10:0);
      points=[[x1,sourceY],[gutter,sourceY],[gutter,targetY],[x2,targetY]];
    }
    return {from:from.id,to:to.id,cross,owner:to.owner,points};
  });
}
function routesSVG(cards){
  return '<g id="workflow-routes" aria-hidden="true">'+connections(cards).map(edge=>`<path data-from="${edge.from}" data-to="${edge.to}" d="${edge.points.map(([x,y],i)=>`${i?'L':'M'}${x} ${y}`).join(' ')}" fill="none" stroke="${edge.cross?C[edge.owner]:C.flow}" stroke-width="${edge.cross?2.5:2.2}" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-${edge.cross?edge.owner:'small'})"/>`).join('')+'</g>';
}
function drawScene(scene,options={}){
  const cards=options.positions||layoutCards(options.cards||scene.cards),owners=options.owners||scene.owners;
  const emphasis=new Set(options.emphasis||[]);
  let out='<defs>';
  for(const [id,color,size] of [['human',C.human,10],['ai',C.ai,10],['small',C.flow,7]]){
    out+=`<marker id="arrow-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="${size}" markerHeight="${size}" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>`;
  }
  out+='</defs>'+rect(0,0,1920,1080,C.bg,'none',0);
  out+=text(64,88,'E2E',58,C.ink,700)+text(198,87,'· End to End',34,C.muted,450);
  out+=text(1856,74,scene.title,40,C.ink,650,'end')+text(1856,117,scene.caption,26,C.muted,400,'end');
  // Fixed chain, with two lines for six-character labels.
  out+='<g id="e2e-chain">';
  CHAIN.forEach(([id,label],i)=>{
    const x=64+i*182,owner=owners[i],lines=id==='browser'?['浏览器','验证']:label.length>4?[label.slice(0,2),label.slice(2)]:[label];
    out+=`<g id="chain-${id}" data-owner="${owner}" aria-label="${esc(label)}：${owner==='ai'?'AI':'人类'}">`
      +rect(x,158,154,82,C[owner+'Soft'],emphasis.has(id)?C[owner]:C.line,10,`id="chain-bg-${id}" stroke-width="${emphasis.has(id)?2.5:1}"`)
      +lines.map((line,j)=>text(x+77,lines.length===1?209:193+j*32,line,27,C[owner],550,'middle',`id="chain-text-${id}-${j}"`)).join('')+'</g>';
    if(i<CHAIN.length-1)out+=`<path d="M${x+161} 199 H${x+176} m-5 -5 5 5 -5 5" fill="none" stroke="${C.route}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  out+='</g>';
  out+=rect(64,286,832,684,C.paper,C.line,20)+rect(1024,286,832,684,C.paper,C.line,20);
  out+=text(104,337,'人类职责',32,C.human,650)+text(1080,337,'AI 职责',32,C.ai,650);
  if(!options.hideRoutes)out+=routesSVG(cards);
  out+='<g id="responsibility-cards">'+cards.map(card=>cardSVG(card,emphasis.has(card.id))).join('')+'</g>';
  out+=`<g role="progressbar" aria-label="时代进度" aria-valuemin="1" aria-valuemax="6" aria-valuenow="${scene.state.step+1}">`;
  ERAS.forEach((_,i)=>{out+=`<circle cx="${960+(i-2.5)*26}" cy="1022" r="${i===scene.state.step?6:4}" fill="${i<=scene.state.step?C.ai:C.line}"/>`;});
  out+='</g>';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="group" aria-label="${esc(scene.title+'：'+scene.caption)}" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">${out}</svg>`;
}
</script>
<script id="player">
'use strict';
const $=id=>document.getElementById(id);
const reducedQuery=matchMedia('(prefers-reduced-motion: reduce)');
let state=readLocation(),playing=null;
function readLocation(){
  const result=parseState(location.hash);
  if(!new URLSearchParams(location.hash.slice(1)).has('motion')&&reducedQuery.matches)result.motion='reduced';
  return result;
}
function save(){window.history.replaceState(null,'',serializeState(state));}
function updateControls(){
  $('prev').disabled=!prevState(state);$('next').disabled=!playing&&!nextState(state);
  $('motion').checked=state.motion==='reduced';
  // Keep the focused phase button alive during a transition.
  if($('phase-nav').dataset?.step!==String(state.step)){
    $('phase-nav').innerHTML=PHASES.map(([label,step])=>`<button data-jump="${step}" ${step===state.step?'aria-current="step"':''}>${esc(label)}</button>`).join('');
    if($('phase-nav').dataset)$('phase-nav').dataset.step=String(state.step);
  }
  $('stage').setAttribute('aria-busy',String(!!playing));
  const scene=sceneFor(state);
  $('live-status').textContent=`第 ${state.step+1} 个时代，${scene.title}。${scene.caption}`;
}
function render(scene=sceneFor(state),options={}){
  $('stage').innerHTML=drawScene(scene,options);updateControls();
}
function clearPlayback(){
  if(!playing)return;
  playing.timers.forEach(clearTimeout);playing.animations.forEach(a=>a.cancel());playing=null;
}
function finishPlayback(){if(playing){clearPlayback();render();}}
function navigate(target,animate=false){
  if(!target)return;
  const before={...state};clearPlayback();state={...target};save();
  if(animate&&state.motion!=='reduced')play(before,state);else render();
}
function play(before,target){
  clearPlayback();state={...target};save();
  const from=sceneFor(before),to=sceneFor(target),oldPositions=layoutCards(from.cards),newPositions=layoutCards(to.cards);
  const oldById=new Map(oldPositions.map(card=>[card.id,card])),newById=new Map(newPositions.map(card=>[card.id,card]));
  const changed=[...new Set([...oldPositions,...newPositions].map(card=>card.id))].filter(id=>{
    const a=oldById.get(id),b=newById.get(id);return !a||!b||a.owner!==b.owner||a.label!==b.label;
  });
  playing={timers:[],animations:[]};
  const animate=(id,frames,options)=>{const el=$(id);if(el)playing.animations.push(el.animate(frames,options));};
  render(to,{cards:from.cards,owners:from.owners,emphasis:changed});
  animate('workflow-routes',[{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});
  playing.timers.push(setTimeout(()=>{
    playing.animations.forEach(a=>a.cancel());playing.animations=[];
    const removed=oldPositions.filter(card=>!newById.has(card.id));
    render(to,{positions:[...newPositions,...removed],hideRoutes:true,emphasis:changed});
    for(const card of newPositions){
      const old=oldById.get(card.id);
      if(old){
        animate('card-'+card.id,[{transform:`translate(${old.x}px, ${old.y}px)`},{transform:`translate(${card.x}px, ${card.y}px)`}],{duration:600,delay:100,fill:'both',easing:'cubic-bezier(.4,0,.2,1)'});
        if(old.owner!==card.owner)animate('card-bg-'+card.id,[{fill:C[old.owner+'Soft']},{fill:C[card.owner+'Soft']}],{duration:700,fill:'both'});
      }else animate('card-'+card.id,[{opacity:0},{opacity:1}],{duration:450,delay:250,fill:'both'});
    }
    for(const card of removed)animate('card-'+card.id,[{opacity:1},{opacity:0}],{duration:180,fill:'forwards'});
    CHAIN.forEach(([id,label],i)=>{
      if(from.owners[i]===to.owners[i])return;
      animate('chain-bg-'+id,[{fill:C[from.owners[i]+'Soft']},{fill:C[to.owners[i]+'Soft']}],{duration:700,fill:'both'});
      for(let j=0;j<(label.length>4?2:1);j++)animate(`chain-text-${id}-${j}`,[{fill:C[from.owners[i]]},{fill:C[to.owners[i]]}],{duration:700,fill:'both'});
    });
  },200));
  playing.timers.push(setTimeout(()=>{
    playing.animations.forEach(a=>a.cancel());playing.animations=[];render();
    animate('workflow-routes',[{opacity:0},{opacity:1}],{duration:300,fill:'forwards'});
  },900));
  playing.timers.push(setTimeout(()=>{clearPlayback();render();},1200));
}
function forward(){if(playing)finishPlayback();else navigate(nextState(state),true);}
function backward(){navigate(prevState(state));}
function replay(){
  if(playing){finishPlayback();return;}
  if(state.step&&state.motion!=='reduced')play(prevState(state),state);else render();
}
function reset(){navigate({...defaults(),motion:state.motion});}
function jump(step){if(Number.isInteger(step)&&step>=0&&step<ERAS.length)navigate({...state,step});closeControls();}
function openControls(){finishPlayback();$('controls').showModal();$('close-controls').focus();}
function closeControls(){if($('controls').open)$('controls').close();}
$('prev').onclick=backward;$('next').onclick=forward;$('replay').onclick=replay;$('reset').onclick=reset;$('close-controls').onclick=closeControls;
$('phase-nav').onclick=e=>{const button=e.target.closest('[data-jump]');if(button)jump(Number(button.dataset.jump));};
$('motion').onchange=e=>navigate({...state,motion:e.target.checked?'reduced':'full'});
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('fullscreen-note').textContent='浏览器未允许页面全屏；可使用浏览器的全屏命令。';}};
$('controls').addEventListener('click',e=>{if(e.target===$('controls')){const r=$('controls').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeControls();}});
$('controls').addEventListener('close',()=>{$('stage').focus();});
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;
  if(e.key==='Escape'){closeControls();return;}
  if(e.target.closest('input,select,textarea,[contenteditable="true"]'))return;
  if(e.key===' '&&e.target.closest('button'))return;
  const key=e.key.toLowerCase();
  if(!['arrowright','arrowleft',' ','p','r','c'].includes(key))return;
  e.preventDefault();
  if(key==='arrowright'||key===' ')forward();else if(key==='arrowleft')backward();else if(key==='p')replay();else if(key==='r')reset();else $('controls').open?closeControls():openControls();
});
addEventListener('hashchange',()=>{clearPlayback();state=readLocation();save();render();});
addEventListener('resize',finishPlayback);
reducedQuery.addEventListener('change',e=>navigate({...state,motion:e.matches?'reduced':'full'}));
save();render();
</script>
</body>
</html>
