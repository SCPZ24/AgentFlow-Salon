<script>
'use strict';
const $=id=>document.getElementById(id);
const media=matchMedia('(prefers-reduced-motion: reduce)');

// Every index describes a complete paused scene; no state depends on a previous animation.
const scenes=[
{g:0,title:'来源 ≠ 消息类型',body:'文件、命令、会话，先是材料。',action:'选择之后，才进入本轮请求。',caption:'先看来源，再看它最终进入哪里。'},
{g:1,title:'默认身份与规则',body:'由 Harness 提供基础说明。',action:'不是每次都由用户手写。',caption:'默认系统提示词，先装入基础块。',flow:['src-base','system','身份与规则']},
{g:1,title:'工具的文字简述',body:'基础块可以介绍工具用途。',action:'文字介绍 ≠ 可调用定义。',caption:'系统提示词里的工具简述，仍然是文字。',flow:['src-base','system','工具简述']},
{g:2,title:'追加补充说明',body:'APPEND_SYSTEM.md 补充基础规则。',action:'追加，不替换基础块。',caption:'补充说明被复制进来，源文件仍在。',flow:['src-append','system','补充说明']},
{g:2,title:'加载项目规范',body:'示意：全局 + 当前项目的 AGENTS.md。',action:'规则是指令，不是权限屏障。',caption:'加载到的项目说明，进入系统补充。',flow:['src-agents','system','项目规范']},
{g:2,title:'只列技能目录',body:'seat-check：余票检查规范。',action:'目录可见 ≠ 正文已读。',caption:'先知道有哪些技能，不等于读过所有技能。',flow:['src-skill','system','名称 + 描述']},
{g:2,title:'补上工作目录',body:'cwd：/campus-day',action:'不自动装入全仓库正文。',caption:'工作目录是定位信息，不是仓库内容。',flow:['assembly','system','cwd']},
{g:3,title:'基础块可替换',body:'SYSTEM.md 只替换默认基础。',action:'补充、项目、技能、cwd 保留。',caption:'切换基础提示词，已追加的上下文仍然保留。'},
{g:4,title:'登记活跃工具',body:'read · edit · bash 的参数定义。',action:'schema 独立放入 tools。',caption:'活跃工具定义，进入独立的 tools 区。',flow:['src-tools','tools','工具 schema']},
{g:5,title:'展开用户命令',body:'/fix-seats → 修复余票文案',action:'模板展开为用户请求。',caption:'提示词模板通常进入 user 消息。',flow:['src-session','messages','user 请求']},
{g:5,title:'带上会话分支',body:'当前分支里的历史消息。',action:'不自动获得 system 级别。',caption:'历史与本次请求，在 messages 中组织。',flow:['src-session','messages','会话历史']},
{g:6,title:'出现相关任务',body:'“按项目规范修复余票文案。”',action:'目录里的 seat-check 与本轮相关。',caption:'本轮任务相关，才准备读取对应技能。',flow:['system','assembly','匹配目录信息']},
{g:6,title:'发出读取请求',body:'read → seat-check/SKILL.md',action:'调用已发出，正文尚未返回。',caption:'Harness 执行读取；列出名称不代表已加载正文。',flow:['assembly','src-skill','read SKILL.md']},
{g:6,title:'正文按需进入',body:'读取到的技能正文，作为工具结果返回。',action:'只读本次需要的一个技能。',caption:'技能正文沿工具结果路径进入 messages。',flow:['src-skill','messages','SKILL.md 正文']},
{g:7,title:'追加运行结果',body:'工具输出成为新的历史消息。',action:'本例：余票检查结果。',caption:'实际运行结果，也进入 messages。',flow:['src-tools','messages','工具结果']},
{g:7,title:'整理较早历史',body:'旧历史可被摘要替代；近期消息保留。',action:'system 与 tools 不变。',caption:'压缩历史材料，不是改变模型权重。',flow:['messages','assembly','较早历史']},
{g:7,title:'摘要回到消息',body:'旧历史变成摘要，近期请求与工具结果保留。',action:'这一轮，拿到需要的信息。',caption:'上下文工程，是让这一轮拿到需要的信息。',flow:['assembly','messages','旧历史摘要']}
];
let state,flights=[];
function defaults(){return {step:0,base:'default',sample:'compact',theme:'light',motion:media.matches?'reduced':'full'};}
function parseHash(){const d=defaults(),p=new URLSearchParams(location.hash.slice(1));const choices={base:['default','custom'],sample:['compact','verbose'],theme:['light','dark'],motion:['full','reduced']};for(const [key,value]of p){if(!Object.hasOwn(d,key)||p.getAll(key).length!==1)return defaults();if(key==='step'){if(!/^\d+$/.test(value)||Number(value)>=scenes.length)return defaults();d.step=Number(value);}else if(!choices[key].includes(value))return defaults();else d[key]=value;}return d;}
function save(){window.history.replaceState(null,'','#'+new URLSearchParams(state));}
function stop(){flights.forEach(a=>a.cancel());flights=[];document.querySelectorAll('.flying').forEach(e=>e.remove());}
function go(n){stop();state.step=Math.max(0,Math.min(scenes.length-1,n));save();render(true);}
function line(text,cls=''){return '<div class="message '+cls+'">'+text+'</div>';}
function render(animate=false,overrideFlow=null){stop();const n=state.step,s=scenes[n],custom=n>=7&&state.base==='custom',verbose=state.sample==='verbose';document.documentElement.classList.toggle('reduced',state.motion==='reduced');$('phase-label').textContent=phases[s.g][0];$('step-count').textContent='动作 '+(n+1)+' / '+scenes.length+' · 已暂停';$('caption').textContent=s.caption;$('assembly-title').textContent=s.title;$('assembly-body').textContent=s.body;$('assembly-action').textContent=s.action;
$('sample-view').innerHTML=verbose?'<div class="sample-bars" aria-label="材料相对较长">'+Array(5).fill('<i class="on"></i>').join('')+'</div><span class="conflict">过期命令 · 无关日志 · 规则冲突</span>':'<div class="sample-bars" aria-label="材料相对精简"><i class="on"></i><i></i><i></i><i></i><i></i></div>';
if(n===4){$('assembly-body').textContent=verbose?'旧框架说明、过期命令，混入本轮需求。':'只改目标文件；保持风格；运行 test:seats。';$('assembly-action').textContent=verbose?'材料变长，不代表更有用。':'不放宽测试；规则仍不是权限屏障。';}
$('base').classList.toggle('custom',custom);$('base').textContent=n===0?'等待装配':custom?'自定义基础：项目维护助手':n>=2?'默认基础：身份 · 规则 · 工具简述':'默认基础：身份 · 规则';
const sup=[];if(n>=3)sup.push('APPEND');if(n>=4)sup.push('全局 / 项目 AGENTS');let tail=[];if(n>=5)tail.push('技能目录：名称 / 描述');if(n>=6)tail.push('cwd');$('supplements').innerHTML=(n>=4&&verbose?'APPEND · AGENTS：<span style="color:var(--red)">新旧命令冲突</span>':sup.length?sup.join(' · '):'')+(tail.length?'<br>'+tail.join(' · '):'');
$('tool-body').textContent=n>=8?'read · edit · bash':'待登记';$('tool-body').classList.toggle('empty',n<8);
let msgs='';if(n>=10)msgs+=line(n>=16?'旧历史 → 摘要':'较早会话历史',n>=16?'summary':'');if(n>=9)msgs+=line('<span class="role">user</span> · 修复余票文案');if(n>=13)msgs+=line('<span class="role">tool</span> · '+(n>=14?'read SKILL.md → 正文 · 检查结果':'read SKILL.md → 正文'),'skill');else if(n===12)msgs+=line('<span class="role">assistant</span> · read SKILL.md');$('message-body').innerHTML=msgs||'<div class="empty">等待用户请求与历史</div>';
$('custom').textContent=state.base==='custom'?'基础：SYSTEM.md':'基础：默认';$('custom').setAttribute('aria-pressed',String(state.base==='custom'));$('custom').classList.toggle('selected',state.base==='custom');$('sample').textContent=verbose?'冗长、冲突':'精简、相关';$('sample').setAttribute('aria-pressed',String(verbose));$('sample').classList.toggle('selected',verbose);
$('local-preview').textContent=state.theme==='dark'?'主题：深色':'主题：暖白';$('local-preview').classList.toggle('dark',state.theme==='dark');$('theme').setAttribute('aria-pressed',String(state.theme==='dark'));
$('motion').setAttribute('aria-pressed',String(state.motion==='reduced'));$('motion').textContent=state.motion==='reduced'?'减少动效 ✓':'减少动效';$('prev').disabled=n===0;$('next').disabled=n===scenes.length-1;
$('phases').innerHTML=phases.map((p,i)=>'<button class="phase '+(i===s.g?'current':'')+'" data-step="'+p[1]+'" '+(i===s.g?'aria-current="step"':'')+'><span class="num">'+String(i).padStart(2,'0')+'</span>'+p[0]+'</button>').join('');
const flow=overrideFlow||(n===7?[custom?'src-custom':'src-base','system',custom?'替换基础块':'默认基础块']:s.flow);document.querySelectorAll('.active').forEach(e=>e.classList.remove('active'));if(flow){$(flow[0]).classList.add('active');$(flow[1]).classList.add('active');}drawFlow(flow,animate);
}
function drawFlow(flow,animate){
$('flow-path').setAttribute('d','');if(!flow)return;
const a=$(flow[0]).getBoundingClientRect(),b=$(flow[1]).getBoundingClientRect(),r=$('route').getBoundingClientRect(),right=b.x>a.x,x1=right?a.right:a.left,y1=a.y+a.height/2,x2=right?b.left:b.right,y2=b.y+b.height/2;
const curve=(ax,ay,bx,by)=>`M${ax-r.x} ${ay-r.y} C${(ax+bx)/2-r.x} ${ay-r.y},${(ax+bx)/2-r.x} ${by-r.y},${bx-r.x} ${by-r.y}`;
const viaAssembly=flow[0].startsWith('src-')&&['system','tools','messages'].includes(flow[1]),m=$('assembly').getBoundingClientRect(),midY=m.y+m.height/2;
$('flow-path').setAttribute('d',viaAssembly?curve(x1,y1,m.left,midY)+' '+curve(m.right,midY,x2,y2):curve(x1,y1,x2,y2));
if(!animate||state.motion==='reduced')return;
const el=document.createElement('div');el.className='flying';el.textContent=flow[2];el.style.left=x1+'px';el.style.top=y1+'px';document.body.append(el);
const frames=[{transform:'translate(-50%,-50%)',opacity:0},{opacity:1,offset:.15}];
if(viaAssembly)frames.push({transform:`translate(calc(-50% + ${m.x+m.width/2-x1}px),calc(-50% + ${midY-y1}px))`,opacity:1,offset:.5});
frames.push({transform:`translate(calc(-50% + ${x2-x1}px),calc(-50% + ${y2-y1}px))`,opacity:0});
const animation=el.animate(frames,{duration:420,easing:'cubic-bezier(.2,.7,.3,1)'});flights.push(animation);animation.onfinish=()=>el.remove();
}
$('prev').onclick=()=>go(state.step-1);$('next').onclick=()=>go(state.step+1);$('reset').onclick=()=>{state=defaults();save();render();};$('custom').onclick=()=>{state.base=state.base==='default'?'custom':'default';state.step=Math.max(7,state.step);save();render(true,[state.base==='custom'?'src-custom':'src-base','system','替换基础块']);};$('sample').onclick=()=>{state.sample=state.sample==='compact'?'verbose':'compact';save();render();};$('theme').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';save();render();};$('motion').onclick=()=>{state.motion=state.motion==='full'?'reduced':'full';save();render();};$('phases').onclick=e=>{const b=e.target.closest('[data-step]');if(b)go(Number(b.dataset.step));};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('fullscreen').textContent='请用浏览器全屏';}};
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(['ArrowLeft','ArrowRight','r','R'].includes(e.key)){e.preventDefault();if(e.key.toLowerCase()==='r')$('reset').click();else go(state.step+(e.key==='ArrowRight'?1:-1));}});addEventListener('hashchange',()=>{state=parseHash();save();render();});addEventListener('resize',()=>render());media.addEventListener('change',e=>{state.motion=e.matches?'reduced':'full';save();render();});state=parseHash();save();render();
</script>
</body>
