// Complete scene snapshots; hash values never contain executable markup.

  }
  if (s.branch === 'main') {
    if (s.step>=18) return null;
    if (s.step===9) return {...s,step:10,sub:1};
    if (s.step===10 && s.sub) return {...s,sub:0};
    return {...s,step:s.step+1,sub:0};

const PHASES = [['任务',0],['输入',1],['决策',2],['读取',4],['回传',6],['修改',7],['修改结果',11],['测试',12],['回答',16],['验收',19]];

<script id="scene-art">// The same SVG scene is used by the live page and offline PNG exports.

  else if(b==='context') {points=[[1372,a==='test'?718:454],[1328,a==='test'?718:454],[1328,780],[1286,780],[1076,780],[866,780],[823,780],[823,860],[780,860]];labelAt=[1076,909];}
  else if(b==='file') {points=[[1286,720],[1328,720],[1328,454],[1372,454]];labelAt=[1580,597];}
  else {points=[[1286,720],[1372,720]];labelAt=[1550,615];}
  return {points,label,labelAt,bad:scene.fail};
}
function drawScene(scene,options={}) {
  const s=scene.state, body=[];
  body.push(chrome(scene,'每一轮，多看见一点'));
  body.push(text(64,265,'本次模型可见上下文',36,C.ink,650),text(866,265,'决策 / 执行',36,C.ink,650),text(1372,265,'项目环境',36,C.ink,650));
  body.push(rect(64,299,716,73,C.white,C.line,12,'stroke-width="2"'),text(90,347,'system_prompt',28,C.blue,600),text(374,347,'小范围修改 · 不改测试',32));
  body.push(rect(64,386,716,65,C.white,C.line,12,'stroke-width="2"'),text(90,429,'tools',28,C.blue,600),text(374,429,'read · edit · bash',32));
  body.push(box('context',64,475,716,430,'messages',C.blue,scene.focus==='context'));
  body.push(text(748,521,scene.call?'本轮输入 · Call '+scene.call:'用户任务',26,C.muted,500,'end'));
  body.push(text(90,580,'余票为 0 时，显示「已满员」',34,C.ink,600),line(90,610,754,610));
  const labels=[['read','源码：余票为 0'],['edit','已应用修改'],['bash',scene.fail?'测试失败':'测试 2 / 2 通过']];
  for(let i=0;i<scene.inputCount;i++){
    const y=632+i*66;
    body.push(rect(90,y,664,55,i===2&&scene.fail?C.redSoft:C.blueSoft,'none',9),text(108,y+38,labels[i][0],30,C.blue,650),text(224,y+38,'→  '+labels[i][1],32,i===2&&scene.fail?C.red:C.ink));
  }

    const i=scene.pending-1;
    body.push(rect(90,832,664,55,scene.fail?C.redSoft:C.amberSoft,'none',9),text(108,869,'下轮新增',26,scene.fail?C.red:C.amber,650),text(252,869,labels[i][0]+' → '+labels[i][1],30,scene.fail?C.red:C.amber));
  }
  body.push(box('model',866,326,420,210,'LLM',C.blue,scene.focus==='model'));
  const modelState=scene.verdict==='candidate'?'final · 候选交付':scene.thinking?'决策中 · 示意':scene.tool&&!scene.run?'请求工具':scene.call?'读取本轮输入':'从任务开始';
  body.push(text(1076,431,modelState,34,C.ink,600,'middle'));
  if(scene.tool&&!scene.run)body.push(pill(908,461,336,scene.tool==='bash'?'bash · test:seats':scene.tool+' · seat-label.ts',C.blue,C.blueSoft,28));
  if(scene.verdict==='candidate')body.push(pill(908,461,336,'修改 + 测试证据',C.blue,C.blueSoft));
  body.push(box('harness',866,626,420,210,'Harness',C.amber,scene.focus==='harness'||!!scene.pending));
  body.push(text(1076,731,scene.run?'执行 '+scene.tool:scene.pending?'返回工具结果':'工具执行与回传',34,C.amber,600,'middle'));
  if(scene.run)body.push(text(1076,784,scene.tool==='bash'?'npm run test:seats':'seat-label.ts',28,C.muted,500,'middle'));

  body.push(box('file',1372,326,484,234,'seat-label.ts',C.ink,scene.focus==='file'));
  if(scene.fileState==='unread')body.push(text(1400,449,'文件仍在磁盘',36,C.ink,600),text(1400,506,'正文尚未进入输入',30,C.muted));
  else if(scene.fileState==='read')body.push(text(1400,449,'n = 0',36,C.blue,600),text(1400,506,'当前显示「余票：0」',34));
  else body.push(text(1400,446,'−  余票：0',38,C.red,600),text(1400,509,'+  已满员',38,C.green,600));
  body.push(box('test',1372,651,484,185,'test:seats',scene.testState==='fail'?C.red:scene.testState==='pass'?C.green:C.ink,scene.focus==='test'));
  body.push(text(1400,766,{idle:'○  未运行',running:'→  执行中',pass:'✓  2 / 2 通过',fail:'×  文案不符'}[scene.testState],38,scene.testState==='fail'?C.red:scene.testState==='pass'?C.green:C.ink,650));
  if(scene.verdict==='candidate')body.push(pill(1372,866,484,'候选交付 · 待人类验收',C.purple,C.purpleSoft,30));
  if(scene.fail)body.push(buttonSVG(1492,866,364,'返回测试主线','failure',C.red));
  else if([14,15,16].includes(s.step))body.push(buttonSVG(1566,866,290,'演示测试失败','failure',C.red));
  body.push(routeSVG(options.route===undefined?flowFor(scene):options.route));
  return wrapSVG(body.join(''),scene.caption);
}
</script>
<script id="player">'use strict';
const $=id=>document.getElementById(id);
const reducedQuery=matchMedia('(prefers-reduced-motion: reduce)');
let state=readLocation(),playing=null,lastTransition=null,stableRoute;
function readLocation(){const s=parseState(location.hash);if(!new URLSearchParams(location.hash.slice(1)).has('motion')&&reducedQuery.matches)s.motion='reduced';return s;}
function save(){window.history.replaceState(null,'',serializeState(state));}
function updateControls(){
  const scene=sceneFor(state);
  $('prev').disabled=!prevState(state);$('next').disabled=!playing&&!nextState(state);
  $('replay').disabled=!prevState(state);
  $('motion').checked=state.motion==='reduced';
  $('phase-nav').innerHTML=PHASES.map(([label,step],i)=>`<button type="button" data-jump="${step}" ${scene.g===i?'aria-current="step"':''}>${label}</button>`).join('');
  $('branch-controls').hidden=KIND==='a02';
  if(KIND!=='a02'){$('failure').textContent=state.branch==='fail'?'返回主线':KIND==='a01'?'演示测试失败':'演示异常';$('failure').disabled=state.branch!=='fail'&&(KIND==='a01'?![14,15,16].includes(state.step):scene.g!==4);}
  $('a02-controls').hidden=KIND!=='a02';
  if(KIND==='a02'){$('custom').checked=state.base==='custom';$('sample').checked=state.sample==='verbose';$('theme').checked=state.theme==='dark';}
  $('live-status').textContent=scene.caption;
  $('stage').setAttribute('aria-busy',String(!!playing));
}
function render(s=state,route=stableRoute){
  $('stage').innerHTML=drawScene(sceneFor(s),route===undefined?{}:{route});
  updateControls();
}
function clearPlayback(){
  if(!playing)return;
  playing.timers.forEach(clearTimeout);playing.animations.forEach(a=>a.cancel());playing=null;
}
function finishPlayback(){if(!playing)return;clearPlayback();render();}
function navigate(target,animate=false){
  if(!target)return;
  const before={...state};clearPlayback();stableRoute=undefined;state=target;save();
  if(!animate||state.motion==='reduced'){lastTransition=null;render();return;}
  play(before,state);
}
function play(before,target){
  clearPlayback();state={...target};save();
  const from=sceneFor(before),to=sceneFor(target);
  const moved=KIND==='a03'?to.owners.map((owner,i)=>owner!==from.owners[i]?i:-1).filter(i=>i>=0):[];
  // Sequential playback uses one responsibility move per click.
  const baseChanged=KIND==='a02'&&before.base!==target.base;
  const route=moved.length?null:flowFor(baseChanged?{...to,flow:[target.base==='custom'?'src-custom':'src-base','system','基础块']}:to);
  stableRoute=baseChanged?route:undefined;
  playing={timers:[],animations:[]};lastTransition={from:{...before},to:{...target}};
  render(before,route);
  $('live-status').textContent=to.caption;
  $('scene-caption').textContent=to.caption;
  const svg=$('stage').querySelector('svg');
  let actor,points;
  if(moved.length===1){
    const i=moved[0],a=cardPosition(from.owners[i],i),b=cardPosition(to.owners[i],i);
    actor=$('responsibility-'+i);points=[[0,0],[b.x-a.x,b.y-a.y]];
    actor.style.transformBox='view-box';actor.style.transformOrigin='0 0';
    const shape=actor.querySelector('rect');
    playing.animations.push(shape.animate([{width:a.w+'px',offset:0},{width:a.w+'px',offset:300/1300},{width:b.w+'px',offset:1}],{duration:1300,fill:'forwards',easing:'linear'}));
    svg.append(actor);
  } else if(route){
    svg.insertAdjacentHTML('beforeend',packetSVG(route.label,route.bad));actor=$('packet');points=route.points;
  }
  const later=(fn,delay)=>playing.timers.push(setTimeout(()=>{if(playing)fn();},delay));
  if(actor){
    actor.setAttribute('opacity','1');
    const pathPoints=points,distances=[0];
    for(let i=1;i<pathPoints.length;i++)distances[i]=distances[i-1]+Math.hypot(pathPoints[i][0]-pathPoints[i-1][0],pathPoints[i][1]-pathPoints[i-1][1]);
    const length=distances[distances.length-1]||1;
    const transform=p=>`translate(${p[0]}px, ${p[1]}px)`;
    const frames=[{transform:transform(pathPoints[0]),offset:0},{transform:transform(pathPoints[0]),offset:300/1300},...pathPoints.slice(1).map((p,i)=>({transform:transform(p),offset:(300+1000*distances[i+1]/length)/1300}))];
    const animation=actor.animate(frames,{duration:1300,fill:'forwards',easing:'linear'});playing.animations.push(animation);
  } else {
    const id=KIND==='a01'?to.focus:KIND==='a02'?'system':`responsibility-${to.focus}`;
    const el=$(id);
    if(el)playing.animations.push(el.animate([{opacity:1},{opacity:.55},{opacity:1}],{duration:1000,iterations:1}));
  }
  later(()=>{
    playing.animations.forEach(a=>a.cancel());playing.animations=[];
    render(target);
    // Landing keeps the changed content and path visible for explanation.
    const focus=KIND==='a01'?to.focus:KIND==='a02'?(to.flow?.[1]||'messages'):moved.length?`responsibility-${moved[0]}`:`responsibility-${to.focus}`;
    if($(focus))playing.animations.push($(focus).animate([{opacity:.65},{opacity:1}],{duration:500,fill:'forwards'}));
  },1300);
  later(()=>{clearPlayback();render();},1800);
}
function forward(){if(playing){finishPlayback();return;}navigate(nextState(state),true);}
function backward(){navigate(prevState(state));}
function replay(){
  if(playing){finishPlayback();return;}
  if(state.motion==='reduced'){render();return;}
  const before=lastTransition&&serializeState(lastTransition.to)===serializeState(state)?lastTransition.from:prevState(state);
  if(before)play(before,state);
}
function reset(){navigate({...defaults(),motion:reducedQuery.matches?'reduced':'full'});}
function jump(step){navigate(KIND==='a02'?{...state,step}:mainState(state,step));closeControls();}
function failure(){
  if(KIND==='a02')return;
  if(state.branch==='fail')navigate(mainState(state,KIND==='a01'?14:10));
  else navigate({...mainState(state,0),branch:'fail'});
  closeControls();
}
function openControls(){finishPlayback();$('controls').showModal();$('next').focus();}
function closeControls(){if($('controls').open)$('controls').close();}
function dispatch(action){
  if(action==='controls')openControls();
  else if(action==='failure')failure();
  else if(action.startsWith('jump:'))jump(Number(action.split(':')[1]));
  else if(action.startsWith('decide:')){finishPlayback();const choice=action.split(':')[1];navigate(decide(state,choice),!['new','clarify'].includes(choice));}
}
$('stage').addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(button)dispatch(button.dataset.action);});
$('stage').addEventListener('keydown',e=>{const button=e.target.closest('[data-action]');if(button&&['Enter',' '].includes(e.key)){e.preventDefault();e.stopPropagation();dispatch(button.dataset.action);}});
$('prev').onclick=backward;$('next').onclick=forward;$('replay').onclick=replay;$('reset').onclick=reset;$('failure').onclick=failure;$('close-controls').onclick=closeControls;
$('phase-nav').onclick=e=>{const b=e.target.closest('[data-jump]');if(b)jump(Number(b.dataset.jump));};
$('motion').onchange=e=>navigate({...state,motion:e.target.checked?'reduced':'full'});
$('custom').onchange=e=>{const target={...state,step:Math.max(7,state.step),base:e.target.checked?'custom':'default'};navigate(target,true);};
$('sample').onchange=e=>navigate({...state,sample:e.target.checked?'verbose':'compact'});
$('theme').onchange=e=>navigate({...state,theme:e.target.checked?'dark':'light'});
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('fullscreen-note').textContent='浏览器未允许页面全屏；可使用浏览器的全屏命令。';}};
$('controls').addEventListener('click',e=>{if(e.target===$('controls')){const r=$('controls').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeControls();}});
$('controls').addEventListener('close',()=>{$('stage').querySelector('[data-action="controls"]')?.focus();});
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;
  if(e.key==='Escape'){closeControls();return;}
  if(e.target.closest('input,select,textarea,[contenteditable="true"]'))return;
  if(e.key===' '&&e.target.closest('button,[data-action]'))return;
  const k=e.key.toLowerCase();
  if(['arrowright','arrowleft',' ','p','r','c'].includes(k)){
    e.preventDefault();
    if(k==='arrowright'||k===' ')forward();else if(k==='arrowleft')backward();else if(k==='p')replay();else if(k==='r')reset();else $('controls').open?closeControls():openControls();
  }
});
addEventListener('hashchange',()=>{clearPlayback();stableRoute=undefined;state=readLocation();lastTransition=null;save();render();});
addEventListener('resize',finishPlayback);
reducedQuery.addEventListener('change',e=>navigate({...state,motion:e.matches?'reduced':'full'}));
save();render();
</script>
