<style>

<body>

<script id="scene-model">
'use strict';
// A teaching transcript, not a provider's wire format or a real reasoning trace.
const CHUNKS = [
  {kind:'system prompt',text:'你是编程助手。先定位问题，再修改代码，最后运行测试验证。'},
  {kind:'tools',text:'read · edit · bash'},
  {kind:'user prompt',text:'npm test 报错了，请帮我修复。'},
  {kind:'thinking',text:'先运行测试，确认具体失败。'},
  {kind:'tool',text:'bash：npm test',name:'bash',command:'npm test'},
  {kind:'observation',text:'FAIL src/add.test.ts · add(2, 3)：预期 5，实际 -1',status:'fail'},
  {kind:'thinking',text:'加法结果不对，读取对应的实现。'},
  {kind:'tool',text:'read：src/add.ts',name:'read',command:'src/add.ts'},
  {kind:'observation',text:'export const add = (a, b) => a - b;',status:'read'},
  {kind:'thinking',text:'实现用了减法，把 - 改成 +。'},
  {kind:'tool',text:'edit：src/add.ts · a - b → a + b',name:'edit',command:'src/add.ts',diff:['−  a - b','+  a + b']},
  {kind:'observation',text:'修改已应用。',status:'edited'},
  {kind:'thinking',text:'重新运行测试，检查修复结果。'},
  {kind:'tool',text:'bash：npm test',name:'bash',command:'npm test'},
  {kind:'observation',text:'PASS src/add.test.ts · 1 passed',status:'pass'},
  {kind:'thinking',text:'测试已通过，可以说明修复结果。'},
  {kind:'final',text:'已将 add 的减法改为加法，测试通过。'}
];
const LAST_STEP = CHUNKS.length - 3;
const PHASES = [['开始',0],['复现',1],['读取',4],['修改',7],['验证',10],['回答',13]];
function defaults(){return {step:0,branch:'main',motion:'full'};}
function parseState(hash){
  const s=defaults(),p=new URLSearchParams(hash.replace(/^#/,''));
  for(const [key,value] of p){
    if(!Object.hasOwn(s,key)||p.getAll(key).length!==1)return defaults();
    if(key==='step'){
      if(!/^\d+$/.test(value)||Number(value)>LAST_STEP)return defaults();
      s.step=Number(value);
    }else if(key==='branch'){
      if(value!=='main')return defaults();
    }else if(['full','reduced'].includes(value))s.motion=value;
    else return defaults();
  }
  return s;
}
function serializeState(s){return '#'+new URLSearchParams(s).toString();}
function nextState(s){return s.step<LAST_STEP?{...s,step:s.step+1}:null;}
function prevState(s){return s.step>0?{...s,step:s.step-1}:null;}
function sceneFor(s){
  const chunks=CHUNKS.slice(0,s.step+3),current=chunks[chunks.length-1];
  const phase=s.step?({tool:'action',observation:'observation',thinking:'thinking',final:'final'}[current.kind]):'ready';
  let tool=null;
  for(const chunk of chunks){
    if(chunk.kind==='tool')tool={name:chunk.name,command:chunk.command,diff:chunk.diff||null,result:null,status:'running'};
    if(chunk.kind==='observation'&&tool)tool={...tool,result:chunk.text,status:chunk.status};
  }
  return {state:s,chunks,current,phase,tool,call:chunks.filter(c=>c.kind==='thinking').length};
}
</script>
<script id="scene-art">
// Pure SVG rendering is shared by the live page and offline static exports.
const C={bg:'#F7F6F0',paper:'#FDFDF9',ink:'#25332F',muted:'#718078',line:'#DCE1D8',green:'#397664',greenSoft:'#EAF2EA',blue:'#416C9B',blueSoft:'#EDF2F8',amber:'#996C30',amberSoft:'#F8F0DF',red:'#AC5147',redSoft:'#F8EEEA'};
const MONO="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace";
const V={x:88,y:300,w:1104,h:550};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const rect=(x,y,w,h,fill=C.paper,stroke='none',r=12,extra='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" ${extra}/>`;
const text=(x,y,value,size=30,color=C.ink,weight=400,extra='')=>`<text x="${x}" y="${y}" font-size="${size}" fill="${color}" font-weight="${weight}" ${extra}>${esc(value)}</text>`;
const line=(x1,y1,x2,y2,color=C.line,width=1.5)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}"/>`;
function wrapText(value,width,size=30,mono=false){
  const lines=[];let row='',used=0;
  const measure=s=>Array.from(s).reduce((sum,c)=>sum+(c.charCodeAt(0)>255?size:size*(mono?.62:.6)),0);
  const tokens=value.match(/[A-Za-z0-9_./]+|[<=>+−-]+|[^\S\n]+|\n|./gu)||[];
  for(const token of tokens){
    // Keep identifiers and operators together; long paths can still wrap.
    for(const part of measure(token)>width?Array.from(token):[token]){
      const w=measure(part);
      if(part==='\n'||(row&&used+w>width)){lines.push(row.trimEnd());row='';used=0;}
      if(part!=='\n'&&(row||part.trim())){row+=part;used+=w;}
    }
  }
  if(row)lines.push(row.trimEnd());
  return lines;
}
function chunkLayout(scene){
  let y=0;
  const rows=scene.chunks.map((chunk,i)=>{
    const mono=['tool','tools'].includes(chunk.kind)||chunk.status==='read';
    const lines=wrapText(chunk.text,790,30,mono),h=Math.max(84,lines.length*40+36);
    const row={...chunk,i,y,h,lines,mono};y+=h+14;return row;
  });
  return {rows,height:Math.max(0,y-14),maxScroll:Math.max(0,y-14-V.h)};
}
function kindColor(kind){return kind==='thinking'?C.blue:kind==='tool'?C.amber:['observation','final'].includes(kind)?C.green:C.muted;}
function drawContext(scene,offset,highlight){
  const layout=chunkLayout(scene),yOffset=Math.max(0,Math.min(offset??layout.maxScroll,layout.maxScroll));
  let out=`<g id="context">`+rect(64,194,1156,734,C.paper,C.line,22)+text(94,250,'模型上下文',34,C.ink,600);
  out+=text(1186,249,`${scene.chunks.length} chunks`,24,C.muted,400,'text-anchor="end"')+line(88,278,1196,278);
  out+=`<g id="context-viewport" tabindex="0" role="region" aria-label="上下文记录，可滚动回看" clip-path="url(#context-clip)">`+rect(V.x,V.y,V.w,V.h,'transparent','none',0,'class="viewport-hit"');
  out+=`<g id="chunk-list" transform="translate(0 ${V.y-yOffset})">`;
  for(const row of layout.rows){
    const color=kindColor(row.kind),active=row.i===scene.chunks.length-1&&scene.state.step>0;
    const fill=active?(row.kind==='thinking'?C.blueSoft:row.kind==='tool'?C.amberSoft:C.greenSoft):'#FFFFFF';
    out+=`<g id="chunk-${row.i}" data-kind="${row.kind}">`+rect(90,row.y+2,1090,row.h-4,fill,active?color:C.line,12,`stroke-width="${active?1.6:1}"`);
    if(active)out+=rect(90,row.y+16,4,row.h-32,color,'none',2);
    out+=text(113,row.y+row.h/2+9,row.kind,25,color,500)+line(337,row.y+20,337,row.y+row.h-20,active?color:C.line,1);
    row.lines.forEach((label,j)=>out+=text(361,row.y+40+j*40,label,30,C.ink,400,row.mono?`font-family="${esc(MONO)}"`:''));
    out+='</g>';
  }
  out+='</g></g>';
  if(layout.maxScroll){
    const thumb=Math.max(48,V.h*V.h/layout.height),thumbY=V.y+(V.h-thumb)*yOffset/layout.maxScroll;
    out+=rect(1201,V.y,5,V.h,'#EEF0EA','none',3)+rect(1201,thumbY,5,thumb,'#A9B9AC','none',3);
  }
  out+=line(88,870,1196,870);
  if(yOffset<layout.maxScroll-1)out+=`<g class="svg-button" role="button" tabindex="0" data-action="latest" aria-label="回到最新">`+rect(1024,880,164,36,C.greenSoft,'none',8)+text(1106,905,'回到最新 ↓',22,C.green,500,'text-anchor="middle"')+'</g>';
  if(highlight)out+=rect(66,196,1152,730,'none',C.blue,21,'id="context-pulse" stroke-width="3" pointer-events="none"');
  return out+'</g>';
}
function drawLoop(scene){
  const phase=scene.phase,done=phase==='final';
  let out=rect(1264,194,592,352,C.paper,C.line,22)+text(1296,243,'ReAct 循环',28,C.ink,600);
  out+=text(1824,243,done?'已完成':scene.call?`第 ${scene.call} 次生成`:'准备开始',23,done?C.green:C.muted,500,'text-anchor="end"');
  const paths=[['thinking','M 1708 356 Q 1744 367 1744 398'],['action','M 1586 441 L 1550 441'],['observation','M 1376 400 Q 1376 374 1406 356']];
  for(const [key,d] of paths){
    const active=phase===key;
    out+=`<path d="${d}" fill="none" stroke="${active?kindColor(key==='action'?'tool':key):'#C7D1C7'}" stroke-width="${active?3:2}" marker-end="url(#arrow-${active?key:'muted'})"/>`;
  }
  for(const [key,label,x,y,w] of [['thinking','Thinking',1390,278,340],['action','Action',1592,404,232],['observation','Observation',1296,404,244]]){
    const active=phase===key,color=kindColor(key==='action'?'tool':key),fill=key==='thinking'?C.blueSoft:key==='action'?C.amberSoft:C.greenSoft;
    out+=`<g id="phase-${key}">`+rect(x,y,w,74,active?fill:'#FAFBF7',active?color:C.line,14,`stroke-width="${active?2:1}"`)+text(x+w/2,y+46,label,29,active?color:C.muted,active?600:400,'text-anchor="middle"')+'</g>';
  }
  const hint={ready:'从任务开始，逐步积累上下文',thinking:'模型根据已有上下文决定下一步',action:'工具执行模型发出的请求',observation:'执行结果回到上下文',final:'输出最终回答，循环结束'}[phase];
  return out+text(1560,519,hint,24,done?C.green:C.muted,400,'text-anchor="middle"');
}
function drawTool(scene){
  const tool=scene.tool,reference=scene.phase==='thinking'||scene.phase==='final';
  let out=`<g id="tool-panel">`+rect(1264,574,592,354,C.paper,C.line,22)+text(1296,624,'工具执行',28,C.ink,600);
  const status=!tool?'等待调用':reference?'上一轮结果':tool.result?'结果已返回':'执行中';
  out+=text(1824,624,status,23,!tool||reference?C.muted:tool.result?C.green:C.amber,500,'text-anchor="end"')+line(1296,647,1824,647);
  if(!tool){
    out+=text(1296,714,'等待模型选择工具',30,C.muted)+text(1296,762,'先看任务，再决定下一步。',25,C.muted);
    ['read','edit','bash'].forEach((name,i)=>{out+=rect(1296+i*172,826,150,48,'#F1F3EC','none',9)+text(1371+i*172,858,name,25,C.muted,500,'text-anchor="middle"');});
  }else{
    const color=reference?C.muted:C.amber;
    out+=text(1296,697,tool.name,28,color,600,`font-family="${esc(MONO)}"`)+text(1410,697,tool.command,28,C.ink,400,`font-family="${esc(MONO)}"`);
    if(tool.diff){
      out+=rect(1296,721,528,104,'#F5F6F1','none',10);
      tool.diff.forEach((label,i)=>out+=text(1316,760+i*42,label,29,i?C.green:C.red,400,`font-family="${esc(MONO)}"`));
      out+=text(1296,874,tool.result||'正在应用修改…',26,reference?C.muted:tool.result?C.green:C.amber);
    }else if(tool.result){
      const color=reference?C.muted:tool.status==='fail'?C.red:C.green;
      out+=rect(1296,728,528,150,reference?'#F2F4EE':tool.status==='fail'?C.redSoft:C.greenSoft,'none',12);
      wrapText(tool.result.replace(' · ','\n'),484,28,tool.name==='read').forEach((label,i)=>out+=text(1318,768+i*38,label,28,color,400,tool.name==='read'?`font-family="${esc(MONO)}"`:''));
    }else{
      out+=text(1296,777,tool.name==='read'?'读取文件中…':'运行测试中…',28,C.muted)+text(1296,861,'下一步：接收 observation',23,C.muted);
    }
  }
  return out+'</g>';
}
function drawScene(scene,options={}){
  const step=scene.state.step;
  let body=rect(0,0,1920,1080,C.bg,'none',0)+text(64,126,'ReAct Loop',60,C.ink,650)+text(448,124,'Reason | Act',32,C.muted);
  body+=rect(1614,78,242,48,C.greenSoft,'none',24)+text(1735,110,'示例：修复加法函数',23,C.green,500,'text-anchor="middle"');
  body+=drawContext(scene,options.scrollOffset,options.highlightContext)+drawLoop(scene)+drawTool(options.toolScene||scene);
  body+=`<g role="progressbar" aria-label="播放进度" aria-valuemin="0" aria-valuemax="${LAST_STEP}" aria-valuenow="${step}">`;
  for(let i=1;i<=LAST_STEP;i++)body+=`<circle cx="${960+(i-(LAST_STEP+1)/2)*25}" cy="1004" r="${i===step?6:4}" fill="${i<=step?C.green:'#D5DDD2'}"/>`;
  body+='</g>';
  if(options.flow){
    const returning=options.flow==='observation',color=returning?C.green:C.amber;
    body+=`<g id="flow-cue" pointer-events="none">`+rect(1090,846,360,50,C.bg,'none',10)+`<path d="${returning?'M 1430 871 L 1110 871':'M 1110 871 L 1430 871'}" stroke="${color}" fill="none" stroke-width="3" marker-end="url(#arrow-${returning?'observation':'action'})"/><g id="flow-packet">`+rect(returning?1308:1122,851,88,40,returning?C.greenSoft:C.amberSoft,'none',7)+text(returning?1352:1166,878,returning?'结果':'请求',22,color,500,'text-anchor="middle"')+'</g></g>';
  }
  const markers=[['muted','#C7D1C7'],['thinking',C.blue],['action',C.amber],['observation',C.green]].map(([key,color])=>`<marker id="arrow-${key}" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="group" aria-label="ReAct Loop，第 ${step} 步" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><defs>${markers}<clipPath id="context-clip">${rect(V.x,V.y,V.w,V.h,'white','none',0)}</clipPath></defs>${body}</svg>`;
}
</script>
<script id="player">
'use strict';
const $=id=>document.getElementById(id);
const reducedQuery=matchMedia('(prefers-reduced-motion: reduce)');
let state=readLocation(),playing=null,scrollOffset=chunkLayout(sceneFor(state)).maxScroll,touchY=null;
function readLocation(){
  const s=parseState(location.hash);
  if(!new URLSearchParams(location.hash.slice(1)).has('motion')&&reducedQuery.matches)s.motion='reduced';
  return s;
}
function save(){window.history.replaceState(null,'',serializeState(state));}
function updateControls(){
  $('prev').disabled=!prevState(state);$('next').disabled=!playing&&!nextState(state);$('replay').disabled=!state.step;
  $('motion').checked=state.motion==='reduced';
  const section=PHASES.findLastIndex(([,step])=>step<=state.step);
  $('phase-nav').innerHTML=PHASES.map(([label,step],i)=>`<button data-jump="${step}" ${i===section?'aria-current="step"':''}>${label}</button>`).join('');
  $('stage').setAttribute('aria-busy',String(!!playing));
  const scene=sceneFor(state);
  $('live-status').textContent=`第 ${state.step} 步，${scene.current.kind}：${scene.current.text}`;
}
function render(scene=sceneFor(state),options={}){
  const focused=document.activeElement;
  const focusAction=focused?.getAttribute?.('data-action');
  const contextFocused=focused?.id==='context-viewport';
  $('stage').innerHTML=drawScene(scene,{scrollOffset,...options});updateControls();
  if(contextFocused)$('context-viewport')?.focus();
  else if(focusAction)$('stage').querySelector(`[data-action="${focusAction}"]`)?.focus();
}
function clearPlayback(){
  if(!playing)return;
  playing.timers.forEach(clearTimeout);playing.animations.forEach(a=>a.cancel());playing=null;
}
function followLatest(){scrollOffset=chunkLayout(sceneFor(state)).maxScroll;}
function finishPlayback(){if(!playing)return;clearPlayback();followLatest();render();}
function navigate(target,animate=false){
  if(!target)return;
  const before={...state};clearPlayback();state={...target};save();
  if(animate&&state.motion!=='reduced')play(before,state);
  else{followLatest();render();}
}
function play(before,target){
  clearPlayback();state={...target};save();
  const from=sceneFor(before),to=sceneFor(target),observation=to.phase==='observation',thinking=to.phase==='thinking';
  playing={timers:[],animations:[]};
  scrollOffset=chunkLayout(from).maxScroll;
  if(thinking||observation){
    render({...from,phase:to.phase,call:to.call},{highlightContext:thinking,flow:observation?'observation':null,toolScene:observation?to:from});
  }else{
    followLatest();render(to,{flow:to.phase==='action'?'action':null});
  }
  const animate=(id,frames,options)=>{const el=$(id);if(el)playing.animations.push(el.animate(frames,options));};
  if(thinking)animate('context-pulse',[{opacity:0},{opacity:1},{opacity:0}],{duration:650});
  else if(['action','observation'].includes(to.phase))animate('flow-packet',[{transform:'translateX(0)'},{transform:`translateX(${observation?-186:186}px)`}],{duration:650,fill:'forwards',easing:'ease-in-out'});
  else animate(`chunk-${to.chunks.length-1}`,[{opacity:0},{opacity:1}],{duration:650});
  playing.timers.push(setTimeout(()=>{
    playing.animations.forEach(a=>a.cancel());playing.animations=[];
    followLatest();render();
    animate(`chunk-${to.chunks.length-1}`,[{opacity:.3},{opacity:1}],{duration:350,fill:'forwards'});
  },650));
  playing.timers.push(setTimeout(()=>{clearPlayback();render();},1000));
}
function forward(){if(playing)finishPlayback();else navigate(nextState(state),true);}
function backward(){navigate(prevState(state));}
function replay(){if(playing){finishPlayback();return;}if(!state.step)return;if(state.motion==='reduced'){followLatest();render();}else play(prevState(state),state);}
function reset(){navigate({...defaults(),motion:state.motion});}
function jump(step){navigate({...state,step});closeControls();}
function scrollContext(delta){
  finishPlayback();scrollOffset=Math.max(0,Math.min(chunkLayout(sceneFor(state)).maxScroll,scrollOffset+delta));render();
}
function openControls(){finishPlayback();$('controls').showModal();$('close-controls').focus();}
function closeControls(){if($('controls').open)$('controls').close();}
function dispatch(action){
  if(action==='latest'){finishPlayback();followLatest();render();}
}
$('stage').addEventListener('click',e=>{
  const button=e.target.closest('[data-action]');
  if(button&&button.getAttribute('aria-disabled')!=='true')dispatch(button.dataset.action);
});
$('stage').addEventListener('keydown',e=>{
  const button=e.target.closest('[data-action]');
  if(button&&['Enter',' '].includes(e.key)){
    e.preventDefault();e.stopPropagation();if(button.getAttribute('aria-disabled')!=='true')dispatch(button.dataset.action);
  }
});
function inContext(e){
  const bounds=$('stage').getBoundingClientRect(),x=(e.clientX-bounds.left)*1920/bounds.width,y=(e.clientY-bounds.top)*1080/bounds.height;
  return x>=64&&x<=1220&&y>=194&&y<=928;
}
$('stage').addEventListener('wheel',e=>{
  if(!inContext(e))return;e.preventDefault();
  const scale=e.deltaMode===1?36:e.deltaMode===2?V.h:1920/$('stage').getBoundingClientRect().width;
  scrollContext(e.deltaY*scale);
},{passive:false});
$('stage').addEventListener('touchstart',e=>{const touch=e.touches[0];touchY=inContext(touch)?touch.clientY:null;},{passive:true});
$('stage').addEventListener('touchmove',e=>{
  if(touchY===null)return;e.preventDefault();const y=e.touches[0].clientY;
  scrollContext((touchY-y)*1920/$('stage').getBoundingClientRect().width);touchY=y;
},{passive:false});
$('stage').addEventListener('touchend',()=>{touchY=null;});
$('prev').onclick=backward;$('next').onclick=forward;$('replay').onclick=replay;$('reset').onclick=reset;$('close-controls').onclick=closeControls;
$('phase-nav').onclick=e=>{const button=e.target.closest('[data-jump]');if(button)jump(Number(button.dataset.jump));};
$('motion').onchange=e=>navigate({...state,motion:e.target.checked?'reduced':'full'});
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('fullscreen-note').textContent='浏览器未允许页面全屏；可使用浏览器的全屏命令。';}};
$('controls').addEventListener('click',e=>{if(e.target===$('controls')){const r=$('controls').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeControls();}});
$('controls').addEventListener('close',()=>{$('context-viewport')?.focus();});
document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;
  if(e.key==='Escape'){closeControls();return;}
  if(e.target.closest('input,select,textarea,[contenteditable="true"]'))return;
  if(e.key===' '&&e.target.closest('button,[data-action]'))return;
  if(e.target.id==='context-viewport'&&['ArrowUp','ArrowDown','Home','End'].includes(e.key)){
    e.preventDefault();scrollContext({ArrowUp:-100,ArrowDown:100,Home:-100000,End:100000}[e.key]);return;
  }
  const k=e.key.toLowerCase();
  if(['arrowright','arrowleft',' ','p','r','c'].includes(k)){
    e.preventDefault();
    if(k==='arrowright'||k===' ')forward();else if(k==='arrowleft')backward();else if(k==='p')replay();else if(k==='r')reset();else $('controls').open?closeControls():openControls();
  }
});
addEventListener('hashchange',()=>{clearPlayback();state=readLocation();save();followLatest();render();});
addEventListener('resize',finishPlayback);
reducedQuery.addEventListener('change',e=>navigate({...state,motion:e.matches?'reduced':'full'}));
save();render();
</script>
</body>
